spring.application.name=eventpilot-backend

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventpilot?options=-c%20TimeZone%3DUTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:eventpilot}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:eventpilot_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Server
server.port=8080

# JWT
eventpilot.jwt.secret=${EVENTPILOT_JWT_SECRET}
eventpilot.jwt.expiration-ms=${EVENTPILOT_JWT_EXPIRATION_MS:86400000}