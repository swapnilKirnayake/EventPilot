services:
  postgres:
    image: postgres:17-bookworm
    container_name: eventpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventpilot
      POSTGRES_USER: eventpilot
      POSTGRES_PASSWORD: eventpilot_dev
    ports:
      - "5432:5432"
    volumes:
      - eventpilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpilot -d eventpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eventpilot-postgres-data: